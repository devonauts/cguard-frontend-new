# Despliegue continuo del CRM (app.cguardpro.com) a producción (VM 192.168.86.19).
#
# CUÁNDO
#   - Solo, cada vez que el flujo «CI» termina en VERDE sobre un push a main:
#     se despliega ese commit si sigue siendo la punta de main.
#   - A mano («Run workflow»): desplegar la punta de main, o «revertir» al
#     último respaldo.
#
# DÓNDE CORRE
#   En el ejecutor propio de la oficina (etiqueta `cguard-deploy`, contenedor en
#   el R620): producción no es alcanzable desde GitHub, y está bien que no lo
#   sea. El ejecutor sólo tiene una llave SSH dedicada que la VM acepta
#   únicamente desde la oficina.
#
# QUÉ HACE
#   scripts/deploy/produccion.sh compila EN la VM con su .env de producción y
#   publica con scripts/desplegar.sh crm (backend), el despliegue oficial:
#   valida el artefacto, respalda, publica, prueba la integridad vía
#   Cloudflare, vuelve atrás solo si algo falla y lo registra en
#   Superadmin › Observabilidad › Versiones.
#
# DÓNDE SE VE
#   Actions › Deploy (registros), Code › Deployments › production (historial)
#   y Superadmin › Observabilidad › Versiones.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      modo:
        description: 'deploy = la punta de main · revertir = volver al último respaldo'
        type: choice
        options: [deploy, revertir]
        default: deploy

# Nunca dos despliegues a la vez; si llegan varios, gana el más reciente.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  deployments: write
  issues: write

jobs:
  deploy:
    name: Producción
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, cguard-deploy]
    environment:
      name: production
      url: https://app.cguardpro.com
    # Incluye la espera de la aprobación (hasta 24 h).
    timeout-minutes: 1500
    env:
      HOST: cguardpro@192.168.86.19
    steps:
      - name: Commit a desplegar
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          SHA="$RUN_SHA"
          if [ -z "$SHA" ]; then
            SHA=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/commits/main" | jq -r .sha)
          fi
          if [ "${{ inputs.modo }}" != revertir ]; then
            OK=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=1" \
              | jq -r '.total_count')
            if [ "$OK" = "0" ]; then echo "::error::${SHA:0:8} no tiene CI verde"; exit 1; fi
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "### ${{ inputs.modo || 'deploy' }} · \`${SHA:0:8}\`" >> "$GITHUB_STEP_SUMMARY"

      # Aprobación gratis (GitHub no da revisores obligatorios en privados con
      # este plan): incidencia + «aprobar», o la ventana del botón
      # «Aprobación automática» (cguard-backend). Ver /compartido/aprobar.sh.
      # Las ejecuciones a mano no la piden: ya son una decisión humana.
      - name: Aprobación
        id: aprobacion
        if: github.event_name == 'workflow_run' && steps.sha.outputs.seguir != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          bash /compartido/aprobar.sh "${{ github.repository }}" "${{ steps.sha.outputs.sha }}" "crm"
          rc=$?
          if [ "$rc" = 2 ]; then echo "seguir=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $rc

      - uses: actions/checkout@v7
        if: steps.aprobacion.outputs.seguir != 'false'
        with:
          ref: ${{ steps.sha.outputs.sha }}
          sparse-checkout: scripts/deploy

      - name: Desplegar en la VM (scripts/desplegar.sh crm)
        if: steps.aprobacion.outputs.seguir != 'false'
        run: |
          ssh -o BatchMode=yes -o ServerAliveInterval=30 "$HOST" \
            "bash -s -- ${{ steps.sha.outputs.sha }} ${{ inputs.modo || 'deploy' }} ${{ github.actor }}" \
            < scripts/deploy/produccion.sh

      - name: Salud pública
        if: steps.aprobacion.outputs.seguir != 'false'
        run: |
          for i in 1 2 3 4 5; do
            c=$(curl -s -o /dev/null -w "%{http_code}" https://app.cguardpro.com/) && [ "$c" = 200 ] && { echo "CRM 200"; exit 0; }
            sleep 5
          done
          echo "::error::app.cguardpro.com no responde 200"; exit 1
