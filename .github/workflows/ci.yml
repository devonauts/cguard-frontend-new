# Verificación automática del CRM antes de fusionar.
#
# POR QUÉ EXISTE. Hasta 2026-08-08 no había CI en ninguno de los seis
# repositorios: nada comprobaba el código antes de que llegara a producción.
# Se pudo encender sin limpiar nada porque el repositorio ya compila con cero
# errores; el gate no exige trabajo previo, sólo impide que eso se rompa sin que
# nadie se entere.
#
# 537 archivos, cero pruebas: por ahora el gate es typecheck + build. Ver el plan de QA para las primeras pruebas de Vitest.
#
# Node 22 para igualar el servidor de producción (v22.22.2).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ── LA CONFIGURACIÓN DEL BUILD, AQUÍ Y NO EN UN FICHERO DE NADIE ─────────
    # Los `.env` están en `.gitignore` a propósito, así que un checkout limpio
    # no tiene ninguno: el build de CI salía sin saber a dónde llamar y
    # `verificar-build` lo paraba (que es justo su trabajo).
    #
    # No hace falta fabricar un `.env`: Vite lee también las `VITE_*` que ya
    # vengan en el entorno del proceso, y `verificar-build` usa su mismo
    # `loadEnv`, así que las dos mitades ven el mismo valor.
    #
    # La URL va EN CLARO a propósito: acaba dentro del bundle que sirve el
    # navegador, o sea que es pública por definición. Meterla en un secreto
    # daría una falsa sensación de confidencialidad y además la ocultaría en
    # los registros, que es lo contrario de lo que conviene aquí.
    env:
      VITE_API_URL: https://api.cguardpro.com/api
      # Ésta sí se inyecta desde un secreto: también viaja en el bundle —eso no
      # se puede evitar y se protege restringiendo por referente en Google—
      # pero es una credencial FACTURABLE y no se versiona. Si el secreto no
      # está configurado, llega vacía y el build sigue: es exactamente lo que
      # pasa hoy, no una regresión nueva.
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` respeta el lockfile exactamente y falla si está desincronizado
      # con package.json — que es justo lo que conviene saber.
      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Paridad de idiomas: en y pt deben cubrir TODA la superficie viva de es.
      # Sin esto el portugués derivó a un 12% sin que nadie se enterara (el
      # patrón t('k',{defaultValue:'ES'}) tapa el hueco cayendo a español).
      - name: Paridad i18n (es/en/pt)
        run: npm run i18n:parity

      - name: Compilar
        run: npm run build
