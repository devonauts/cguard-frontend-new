# Verificación automática del CRM antes de fusionar.
#
# POR QUÉ EXISTE. Hasta 2026-08-08 no había CI en ninguno de los seis
# repositorios: nada comprobaba el código antes de que llegara a producción.
# Se pudo encender sin limpiar nada porque el repositorio ya compila con cero
# errores; el gate no exige trabajo previo, sólo impide que eso se rompa sin que
# nadie se entere.
#
# 537 archivos, cero pruebas: por ahora el gate es typecheck + build. Ver el plan de QA para las primeras pruebas de Vitest.
#
# Node 22 para igualar el servidor de producción (v22.22.2).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ── LA CONFIGURACIÓN DEL BUILD, AQUÍ Y NO EN UN FICHERO DE NADIE ─────────
    # Los `.env` están en `.gitignore` a propósito, así que un checkout limpio
    # no tiene ninguno: el build de CI salía sin saber a dónde llamar y
    # `verificar-build` lo paraba (que es justo su trabajo).
    #
    # No hace falta fabricar un `.env`: Vite lee también las `VITE_*` que ya
    # vengan en el entorno del proceso, y `verificar-build` usa su mismo
    # `loadEnv`, así que las dos mitades ven el mismo valor.
    #
    # La URL va EN CLARO a propósito: acaba dentro del bundle que sirve el
    # navegador, o sea que es pública por definición. Meterla en un secreto
    # daría una falsa sensación de confidencialidad y además la ocultaría en
    # los registros, que es lo contrario de lo que conviene aquí.
    env:
      VITE_API_URL: https://api.cguardpro.com/api
      # ── LA CLAVE DE MAPAS EN CI ES UN MARCADOR, A PROPÓSITO ───────────────
      # CI NO construye el artefacto que se publica. El de producción se compila
      # EN EL SERVIDOR, en `~/cguard-frontend-new`, con su propio `.env`, y de
      # ahí sale el `dist` que se copia a `/var/www/frontend`. Esa es la vía por
      # la que la clave real ha llegado siempre, y sigue igual.
      #
      # Lo que CI comprueba es que el CÓDIGO compila, pasa sus pruebas y produce
      # un artefacto bien formado, no que Google conteste. Exigir aquí la
      # credencial real obligaría a configurar un secreto que este repositorio
      # nunca ha necesitado — un requisito nuevo inventado por el gate, no por
      # el producto.
      #
      # `verificar-build` sólo acepta este marcador cuando CI=true: si aparece
      # en cualquier otro sitio, el build se niega a continuar.
      VITE_GOOGLE_MAPS_API_KEY: CI-PLACEHOLDER-NO-ES-UNA-CLAVE-REAL
      # ── MEMORIA PARA EL TYPECHECK ─────────────────────────────────────────
      # Desde 2026-11-03 `tsc --noEmit` pasa de los ~2 GB que Node usa por
      # defecto y muere con «JavaScript heap out of memory» en el runner de
      # GitHub (7 GB). 6 GB deja margen al resto del runner.
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # `npm ci` respeta el lockfile exactamente y falla si está desincronizado
      # con package.json — que es justo lo que conviene saber.
      - name: Instalar dependencias
        run: npm ci

      # Falla en SEGUNDOS si falta configuración, en vez de dos minutos después
      # al final del build. Es el mismo script que corre tras compilar —una sola
      # lista de requisitos— pero en modo «sólo entorno», sin exigir `dist`.
      # Nunca imprime el valor de nada: sólo dice si está.
      - name: Preflight de configuración de producción
        run: node scripts/verificar-build.mjs --solo-entorno

      - name: Typecheck
        run: npx tsc --noEmit

      # Paridad de idiomas: en y pt deben cubrir TODA la superficie viva de es.
      # Sin esto el portugués derivó a un 12% sin que nadie se enterara (el
      # patrón t('k',{defaultValue:'ES'}) tapa el hueco cayendo a español).
      - name: Paridad i18n (es/en/pt)
        run: npm run i18n:parity

      # Vitest no estaba en el gate: 104 pruebas corrían sólo si alguien se
      # acordaba de lanzarlas a mano. Se usa el comando canónico del proyecto.
      - name: Pruebas (Vitest)
        run: npm test

      # `npm run build` es `tsc && vite build && node scripts/verificar-build.mjs`,
      # así que la verificación del artefacto va DENTRO: comprueba que la URL que
      # Vite resolvió de verdad no es local, es https, y llegó al bundle.
      - name: Compilar y verificar el artefacto
        run: npm run build
