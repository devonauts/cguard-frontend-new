<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- SIN `maximum-scale` NI `user-scalable=0`. Bloquear el pellizco es una
         barrera de accesibilidad, y aquí pesa el doble: esto se usa en la calle,
         con guantes, a contraluz y con gente que necesita agrandar una placa o
         una coordenada para leerla. iOS además ignora el bloqueo desde hace
         años, así que lo único que conseguía era romper el zoom en Android.
         Ojo: al devolver el zoom, iOS vuelve a ampliar solo al enfocar un campo
         de menos de 16 px — por eso glass.css fija 16 px en pantalla táctil.

         `viewport-fit=cover` SÍ va, y ahora es seguro: las tres piezas que
         tienen que sumar lo mismo ya usan la misma fórmula —la cabecera y
         `<main>` en `app-layout.tsx`, y `.cg-route-progress` en glass.css—,
         todas con `env(safe-area-inset-top)`. Sin `cover`, esa variable vale
         `0px` y el resultado es idéntico al de antes; con `cover`, la cabecera
         reserva la muesca en vez de meterse debajo. El cajón lateral y el rail
         reservan además el inset izquierdo, que es el que muerde en apaisado. -->
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0"
    />

    <title>C-Guard Pro | Plataforma de Gestión de Seguridad Física</title>

    <!-- Poppins is self-hosted (bundled via src/main.tsx) — no render-blocking
         Google Fonts CDN request, and no dependency on a CDN that email/geo
         filters sometimes block. (Removed the duplicate CDN <link>.) -->

    <!-- SEO Core -->
    <meta
      name="description"
      content="C-Guard Pro es la plataforma líder en gestión de seguridad física: control de guardias, puestos de vigilancia, rutas de patrullaje, reportes en tiempo real y seguimiento GPS desde la nube."
    />
    <meta
      name="keywords"
      content="C-Guard Pro, gestión de seguridad, guardias de seguridad, puestos de vigilancia, patrullaje, seguimiento GPS, seguridad física, Ecuador, plataforma seguridad, control guardias"
    />
    <meta name="author" content="C-Guard Pro" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f97316" />
    <link rel="canonical" href="https://app.cguardpro.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="C-Guard Pro" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:title" content="C-Guard Pro | Plataforma de Gestión de Seguridad Física" />
    <meta
      property="og:description"
      content="Gestiona tus operaciones de seguridad con C-Guard Pro: puestos de vigilancia, guardias, rutas de patrullaje, reportes y seguimiento GPS en tiempo real."
    />
    <meta property="og:url" content="https://app.cguardpro.com/" />
    <meta property="og:image" content="https://app.cguardpro.com/assets/logo/c-guard-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="C-Guard Pro | Plataforma de Gestión de Seguridad Física" />
    <meta
      name="twitter:description"
      content="Gestiona guardias, puestos de vigilancia y rutas de patrullaje con C-Guard Pro. Seguimiento GPS en tiempo real."
    />
    <meta name="twitter:image" content="https://app.cguardpro.com/assets/logo/c-guard-logo.png" />

    <!-- Favicon / Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/logo/c-guard-app-logo.png" />

    <!-- PWA manifest: lo inyecta vite-plugin-pwa en el build (manifest.webmanifest),
         versionado junto al service worker en vite.config.ts. El manifest.json
         suelto de public/ quedó retirado para no servir dos manifests. -->

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "C-Guard Pro",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "url": "https://app.cguardpro.com",
      "description": "Plataforma cloud de gestión de seguridad física: control de guardias, puestos de vigilancia, patrullaje GPS y reportes en tiempo real.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "provider": {
        "@type": "Organization",
        "name": "C-Guard Pro",
        "url": "https://app.cguardpro.com"
      }
    }
    </script>

    <!-- Styles -->
    <script>
    /* Acento guardado ANTES del primer pintado. Sin esto, la app arranca en
       mostaza y salta al color del usuario en cuanto React monta. */
    (function () {
      try {
        var a = JSON.parse(localStorage.getItem('cguard-accent') || 'null');
        if (a && typeof a.h === 'number') {
          document.documentElement.style.setProperty('--brand-h', a.h);
          document.documentElement.style.setProperty('--brand-c', a.c);
        }
      } catch (e) {}
    })();
  </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
